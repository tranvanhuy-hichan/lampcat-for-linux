# Apache config for the local web stack.
# ${XROOT} is defined by lampcat.sh on the command line (-C "Define XROOT ...").
# The panel edits the Listen / ServerName lines below.

ServerRoot "${XROOT}/apache"
PidFile "${XROOT}/apache/run/httpd.pid"
DefaultRuntimeDir "${XROOT}/apache/run"

Listen 8000
ServerName localhost:8000

# mod_php needs the prefork MPM
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_ajp_module modules/mod_proxy_ajp.so
LoadModule php_module modules/libphp8.5.so

PHPIniDir "${XROOT}/php"
<FilesMatch "\.ph(p|tml)$">
    SetHandler application/x-httpd-php
</FilesMatch>

ErrorLog "${XROOT}/apache/logs/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "${XROOT}/apache/logs/access.log" combined

TypesConfig /etc/mime.types
AddDefaultCharset UTF-8
DirectoryIndex index.php index.html index.htm
UseCanonicalName Off
HostnameLookups Off
ServerTokens Prod
ServerSignature Off

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# The shared web root (see config.env / the panel). Apache runs *.php here and
# Tomcat serves the very same folder for *.jsp and servlets.
DocumentRoot "${WEBROOT}"
<Directory "${WEBROOT}">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
</Directory>

# Java files belong to Tomcat: never let Apache hand out their source code.
<FilesMatch "\.(jsp|jspx|jspf|class|jar)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/(WEB-INF|META-INF)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

IncludeOptional "${XROOT}/apache/conf/extra/*.conf"
